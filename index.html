
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video</title>
</head>

<body>

    <h1>AI Video</h1>

    <p>Transforme suas imagens em vídeos com inteligência artificial.</p>

    <hr>

    <h2>Envie uma imagem</h2>

    <input type="file" id="imageInput" accept="image/*">

    <br><br>

    <h2>O que você quer que aconteça?</h2>

    <textarea
        id="prompt"
        placeholder="Ex: O gato começa a dançar..."
        rows="5"
        cols="50"
    ></textarea>

    <br><br>

    <button id="generateButton">
        ✨ Gerar vídeo
    </button>

</body>

</html>
