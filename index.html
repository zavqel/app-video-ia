<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <h1>AI Video</h1>

            <p>
                Transforme suas imagens em vídeos com inteligência artificial.
            </p>
        </header>


        <section class="generator">

            <div class="upload-area">

                <div class="icon">
                    📷
                </div>

                <h2>Envie uma imagem</h2>

                <p>
                    Escolha uma foto para transformar em vídeo.
                </p>

                <label class="upload-button">
                    Escolher imagem

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden
                    >
                </label>

            </div>


            <div class="prompt-area">

                <label for="prompt">
                    O que você quer que aconteça?
                </label>

                <textarea
                    id="prompt"
                    placeholder="Ex: O gato começa a dançar..."
                ></textarea>

            </div>


            <button
                id="generateButton"
                class="generate-button"
            >
                ✨ Gerar vídeo
            </button>

        </section>

    </main>

</body>

</html>
